<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavCore + MapLibre | Interactive Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: white; }
    #map { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 16px; left: 16px;
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1);
      padding: 16px; border-radius: 16px;
      font-size: 13px; min-width: 240px;
      backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 10;
    }
    #hud h3 { margin: 0 0 12px; font-size: 16px; color: #60a5fa; display: flex; align-items: center; gap: 8px; }
    #hud p { margin: 4px 0; color: #94a3b8; display: flex; justify-content: space-between; }
    #hud b { color: white; }
    #instruction {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: #4f46e5; color: white;
      padding: 14px 28px; border-radius: 999px;
      font-size: 16px; font-weight: 700;
      box-shadow: 0 10px 40px rgba(79, 70, 229, 0.5);
      display: none; z-index: 10;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .badge {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">
    <h3>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      NavCore SDK
    </h3>
    <p>Status: <b id="status">Initializing...</b></p>
    <p>Speed: <b id="speed">0 km/h</b></p>
    <p>Distance: <b id="dist">-</b></p>
    <p>ETA: <b id="eta">-</b></p>
    <div style="margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.1); font-size:11px; color:#64748b;">
      Click the map to simulate location if GPS is static
    </div>
  </div>
  <div id="instruction"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
