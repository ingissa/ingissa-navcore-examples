<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavCore + MapLibre | Interactive Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #020617; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    
    /* Device Frame */
    #device {
      width: 380px; height: 780px;
      border: 12px solid #1e293b; border-radius: 48px;
      position: relative; overflow: hidden;
      box-shadow: 0 0 0 2px #334155, 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      background: #000;
    }
    #device::before { /* Dynamic Island / Notch */
      content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 100px; height: 28px; background: #000; border-radius: 20px; z-index: 2000;
    }

    #map { width: 100%; height: 100%; }
    #hud {
      position: absolute; top: 60px; left: 16px; right: 16px;
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255,255,255,0.1);
      padding: 20px; border-radius: 24px;
      font-size: 13px;
      backdrop-filter: blur(16px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    #hud h3 { margin: 0 0 12px; font-size: 16px; color: #60a5fa; display: flex; align-items: center; gap: 8px; }
    #hud p { margin: 4px 0; color: #94a3b8; display: flex; justify-content: space-between; }
    #hud b { color: white; }
    #instruction {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: #4f46e5; color: white;
      padding: 14px 28px; border-radius: 999px;
      font-size: 16px; font-weight: 700;
      box-shadow: 0 10px 40px rgba(79, 70, 229, 0.5);
      display: none; z-index: 10;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .badge {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
    }
    .controls { margin-top: 15px; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; font-size: 11px; }
    .controls label { display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 6px 0; color: #94a3b8; }
    .controls label:hover { color: white; }
    .controls input { cursor: pointer; accent-color: #60a5fa; }
  </style>
</head>
<body>
  <div id="device">
    <div id="map"></div>
  <div id="hud">
    <h3>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      NavCore SDK
    </h3>
    <p>Status: <b id="status">Initializing...</b></p>
    <p>Speed: <b id="speed">0 km/h</b></p>
    <p>Distance: <b id="dist">-</b></p>
    <p>ETA: <b id="eta">-</b></p>
    <div style="margin-top:12px; display: flex; gap: 8px;">
      <button id="start-sim" style="flex: 1; background: #4f46e5; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;">Start Simulation</button>
      <button id="stop-sim" style="background: rgba(255,255,255,0.1); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer;">Stop</button>
    </div>

    <div class="controls">
      <div style="color: #60a5fa; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px;">SDK Engineering View</div>
      <label>
        <input type="checkbox" id="toggle-snap" checked> 
        <span>Route Snapping (Core)</span>
      </label>
      <label>
        <input type="checkbox" id="toggle-smooth" checked> 
        <span>GPS Smoothing (Kalman)</span>
      </label>
      <label style="margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: white; box-shadow: 0 0 10px white;"></div>
        <span>White Ghost = Raw Signal</span>
      </label>
    </div>

    <div style="margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.1); font-size:11px; color:#94a3b8; font-style: italic;">
      Course-up simulation with 15m jitter
    </div>
  </div>
  </div>
  <div id="instruction"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
