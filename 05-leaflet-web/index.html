<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavCore + Leaflet | Interactive Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #020617; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    
    /* Device Frame */
    #device {
      width: 380px; height: 780px;
      border: 12px solid #1e293b; border-radius: 48px;
      position: relative; overflow: hidden;
      box-shadow: 0 0 0 2px #334155, 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      background: #000;
    }
    #device::before { /* Dynamic Island / Notch */
      content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 100px; height: 28px; background: #000; border-radius: 20px; z-index: 2000;
    }

    #map-wrapper { width: 100%; height: 100%; overflow: hidden; position: relative; }
    #map { width: 250%; height: 250%; position: absolute; top: -75%; left: -75%; }
    #hud {
      position: absolute; top: 60px; left: 16px; right: 16px; z-index: 1000;
      background: rgba(15, 23, 42, 0.75); color: #fff;
      padding: 20px; border-radius: 24px; font-size: 14px;
      backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    #hud h3 { margin: 0 0 10px; font-size: 16px; color: #a78bfa; display: flex; align-items: center; gap: 8px; }
    #hud .stat { margin: 4px 0; display: flex; justify-content: space-between; gap: 20px; }
    #hud b { color: #f8fafc; }
    #status { color: #94a3b8; }
    .navcore-vehicle-marker svg { display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .raw-marker { background: rgba(255, 255, 255, 0.4); border: 2px solid white; border-radius: 50%; width: 12px; height: 12px; }
    .controls { margin-top: 15px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-size: 11px; }
    .controls label { display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 4px 0; }
    .controls input { cursor: pointer; accent-color: #7c3aed; }
  </style>
</head>
<body>
  <div id="device">
    <div id="map-wrapper">
      <div id="map"></div>
    </div>
  <div id="hud">
    <h3>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      NavCore + Leaflet
    </h3>
    <div class="stat">Speed: <b id="speed">0 km/h</b></div>
    <div class="stat">Distance: <b id="dist">-</b></div>
    <div class="stat">ETA: <b id="eta">-</b></div>
    <div class="stat">Status: <b id="status">Waiting for GPS...</b></div>
    <div style="margin-top:12px; display: flex; gap: 8px;">
      <button id="start-sim" style="flex: 1; background: #7c3aed; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer;">Start Simulation</button>
      <button id="stop-sim" style="background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer;">Stop</button>
    </div>

    <div class="controls">
      <div style="color: #94a3b8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; font-size: 10px;">SDK Features</div>
      <label>
        <input type="checkbox" id="toggle-snap" checked> 
        <span>Route Snapping</span>
      </label>
      <label>
        <input type="checkbox" id="toggle-smooth" checked> 
        <span>GPS Smoothing (Kalman)</span>
      </label>
      <label style="margin-top: 8px; color: #94a3b8;">
        <div style="width: 10px; height: 10px; border-radius: 50%; border: 1px solid white; background: rgba(255,255,255,0.3);"></div>
        <span>White dot = Raw Input</span>
      </label>
    </div>

    <div style="margin-top:10px; font-size:11px; color:#94a3b8; border-top:1px solid rgba(255,255,255,0.1); padding-top: 8px; font-style: italic;">
      Course-up simulation with 15m jitter
    </div>
  </div>
  </div>
  
  <script type="module" src="./main.ts"></script>
</body>
</html>
