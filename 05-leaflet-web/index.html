<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavCore + Leaflet | Interactive Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: white; }
    #map { width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(0, 0, 0, 0.85); color: #fff;
      padding: 16px 20px; border-radius: 12px; font-size: 14px;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #hud h3 { margin: 0 0 10px; font-size: 16px; color: #a78bfa; display: flex; items-center; gap: 8px; }
    #hud .stat { margin: 4px 0; display: flex; justify-content: space-between; gap: 20px; }
    #hud b { color: #f8fafc; }
    #status { color: #94a3b8; }
    .navcore-vehicle-marker svg { display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">
    <h3>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      NavCore + Leaflet
    </h3>
    <div class="stat">Speed: <b id="speed">0 km/h</b></div>
    <div class="stat">Destionation: <b id="dist">-</b></div>
    <div class="stat">Status: <b id="status">Waiting for GPS...</b></div>
    <div style="margin-top:10px; font-size:11px; color:#64748b; border-top:1px solid rgba(255,255,255,0.1); pt-2">
      Click map to simulate position
    </div>
  </div>
  
  <script type="module" src="./main.ts"></script>
</body>
</html>
